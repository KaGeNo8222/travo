<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TRAVO" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="TRAVO — วางแผนทริปส่วนตัว ใช้งานได้แม้ออฟไลน์" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>TRAVO</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      ;(function () {
        try {
          var t = localStorage.getItem('travo:theme') || 'system'
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>TRAVO ต้องเปิดใช้ JavaScript</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
